<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版自黏便箋</title>
    <!-- 引入 Tailwind CSS 以快速排版 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        /* 自訂滑動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 主容器 -->
    <div id="app-container" class="w-full max-w-sm bg-[#FFF2B2] rounded-xl shadow-2xl overflow-hidden flex flex-col transition-opacity duration-200" style="height: 480px; opacity: 0.9;">
        
        <!-- 1. 上方輸入區 -->
        <div class="bg-[#FFF2B2] px-4 py-3 border-b border-[#E8D58B] flex items-center gap-2">
            <span class="font-bold text-gray-800 text-sm">事項:</span>
            <input type="text" id="content-input" placeholder="輸入待辦事項..." class="flex-1 bg-white px-3 py-1.5 text-sm rounded border border-gray-300 focus:outline-none focus:ring-1 focus:ring-[#E8D58B]">
            <button id="add-btn" class="bg-[#E8D58B] hover:bg-[#d8c377] text-gray-800 text-sm px-3 py-1.5 rounded font-medium transition cursor-pointer">新增代辦</button>
        </div>

        <!-- 2. 中間清單顯示區 -->
        <div class="flex-1 overflow-y-auto p-3 bg-[#FFFDF0] space-y-2 relative" id="task-listbox">
            <!-- 動態生成代辦項目 -->
        </div>

        <!-- 3. 底部控制區 -->
        <div class="bg-[#FCEBA6] px-3 py-2.5 border-t border-[#E8D58B] flex items-center justify-between text-xs text-gray-700">
            <div class="flex items-center gap-1.5">
                <button id="del-btn" class="bg-[#E8D58B] hover:bg-[#d8c377] px-2.5 py-1 rounded transition cursor-pointer">刪除選定</button>
                <button id="simple-btn" class="bg-[#E8D58B] hover:bg-[#d8c377] px-2.5 py-1 rounded transition cursor-pointer">簡易畫面</button>
                <label class="flex items-center gap-1 cursor-pointer select-none">
                    <input type="checkbox" id="topmost-check" class="accent-amber-600" checked> 置頂
                </label>
            </div>
            <div class="flex items-center gap-1">
                <span>透明度</span>
                <input type="range" id="alpha-scale" min="0.3" max="1.0" step="0.1" value="0.9" class="w-16 accent-amber-600 cursor-pointer">
            </div>
        </div>
    </div>

    <!-- 簡易畫面模式 (預設隱藏) -->
    <div id="simple-container" class="fixed hidden bg-[#FFF8D6] border border-[#EAD990] rounded-2xl shadow-2xl p-4 cursor-move select-none" style="width: 300px; min-height: 80px; opacity: 0.9;">
        <div class="flex justify-between items-center mb-2 border-b border-[#EAD990] pb-1">
            <span class="text-xs font-bold text-gray-600">📌 簡易便箋 (雙擊返回主畫面)</span>
            <button id="back-main-btn" class="text-xs text-gray-500 hover:text-red-500">✕</button>
        </div>
        <div id="simple-text-content" class="text-sm text-gray-800 space-y-1 whitespace-pre-wrap"></div>
    </div>

    <!-- 提醒彈出視窗 Modal -->
    <div id="reminder-modal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-5 w-full max-w-xs shadow-xl space-y-4">
            <h3 id="modal-title" class="font-bold text-gray-800 text-base">設定提醒</h3>
            <div id="modal-body" class="space-y-3 text-sm">
                <!-- 動態注入輸入欄位 -->
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="modal-cancel" class="px-3 py-1.5 text-gray-600 bg-gray-100 rounded hover:bg-gray-200 text-xs">取消</button>
                <button id="modal-confirm" class="px-3 py-1.5 text-gray-800 bg-[#E8D58B] rounded hover:bg-[#d8c377] text-xs font-medium">確定</button>
            </div>
        </div>
    </div>

    <!-- 右鍵選單 -->
    <div id="custom-context-menu" class="fixed hidden bg-white shadow-lg rounded border border-gray-200 py-1 z-50 text-xs text-gray-700 w-64">
        <div class="px-3 py-1.5 hover:bg-amber-50 cursor-pointer" data-action="once">📅 設定單次提醒</div>
        <div class="px-3 py-1.5 hover:bg-amber-50 cursor-pointer" data-action="weekday">🔄 設定平日循環 (週一~週五)</div>
        <div class="px-3 py-1.5 hover:bg-amber-50 cursor-pointer" data-action="weekend">🌴 設定假日循環 (週六~週日)</div>
        <div class="px-3 py-1.5 hover:bg-amber-50 cursor-pointer" data-action="monthly">🗓️ 設定每月特定日期循環</div>
        <div class="border-t border-gray-100 my-1"></div>
        <div class="px-3 py-1.5 hover:bg-red-50 text-red-600 cursor-pointer" data-action="none">❌ 清除此項提醒</div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 資料結構初始化
        let tasks = [];
        let alphaVal = 0.9;
        let topmostVal = true;
        let selectedIndex = null;
        let activeContextMenuTaskIndex = null;

        // DOM 元素
        const appContainer = document.getElementById('app-container');
        const contentInput = document.getElementById('content-input');
        const addBtn = document.getElementById('add-btn');
        const taskListbox = document.getElementById('task-listbox');
        const delBtn = document.getElementById('del-btn');
        const simpleBtn = document.getElementById('simple-btn');
        const topmostCheck = document.getElementById('topmost-check');
        const alphaScale = document.getElementById('alpha-scale');
        
        const simpleContainer = document.getElementById('simple-container');
        const simpleTextContent = document.getElementById('simple-text-content');
        const backMainBtn = document.getElementById('back-main-btn');

        const contextMenu = document.getElementById('custom-context-menu');
        const reminderModal = document.getElementById('reminder-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalCancel = document.getElementById('modal-cancel');
        const modalConfirm = document.getElementById('modal-confirm');

        // 讀取 LocalStorage
        function loadData() {
            const saved = localStorage.getItem('sticky_notes_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    tasks = data.tasks || [];
                    alphaVal = data.alpha !== undefined ? data.alpha : 0.9;
                    topmostVal = data.topmost !== undefined ? data.topmost : true;
                } catch (e) {
                    tasks = [];
                }
            }
            alphaScale.value = alphaVal;
            appContainer.style.opacity = alphaVal;
            topmostCheck.checked = topmostVal;
            renderTasks();
        }

        // 儲存至 LocalStorage
        function saveData() {
            const data = {
                tasks: tasks,
                alpha: alphaVal,
                topmost: topmostVal
            };
            localStorage.setItem('sticky_notes_data', JSON.stringify(data));
        }

        // 智慧時間格式化 (0900 -> 09:00)
        function formatTimeInput(rawStr) {
            let val = rawStr.trim();
            if (!val.includes(":") && val.length === 4 && /^\d{4}$/.test(val)) {
                val = val.substring(0, 2) + ":" + val.substring(2);
            }
            return val;
        }

        // 渲染清單
        function renderTasks() {
            taskListbox.innerHTML = "";
            if (tasks.length === 0) {
                taskListbox.innerHTML = `<div class="text-center text-gray-400 text-xs mt-10">目前沒有待辦事項，請在上方新增！</div>`;
                return;
            }

            tasks.forEach((t, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between p-2 rounded cursor-pointer transition select-none text-sm ${selectedIndex === idx ? 'bg-[#E8D58B]/50 border border-[#E8D58B]' : 'hover:bg-amber-100/50 bg-white/60'}`;
                
                let tagStr = "";
                const rType = t.reminder_type || "none";
                if (rType === "once") tagStr = ` <span class="text-xs text-amber-700">(單次 ${t.date} ${t.time})</span>`;
                else if (rType === "weekday") tagStr = ` <span class="text-xs text-blue-700">(平日 ${t.time})</span>`;
                else if (rType === "weekend") tagStr = ` <span class="text-xs text-purple-700">(假日 ${t.time})</span>`;
                else if (rType === "monthly") {
                    const daysStr = (t.days_of_month || []).join(",");
                    tagStr = ` <span class="text-xs text-green-700">(每月 ${daysStr}日 ${t.time})</span>`;
                }

                itemDiv.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1">
                        <span class="font-mono font-bold">${t.checked ? '[✓]' : '[   ]'}</span>
                        <span class="truncate ${t.checked ? 'line-through text-gray-400' : 'text-gray-800'}">${escapeHtml(t.content)}${tagStr}</span>
                    </div>
                `;

                // 點擊選取 / 雙擊切換勾選
                itemDiv.addEventListener('click', (e) => {
                    selectedIndex = idx;
                    renderTasks();
                });
                itemDiv.addEventListener('dblclick', () => {
                    t.checked = !t.checked;
                    saveData();
                    renderTasks();
                });

                // 右鍵選單事件
                itemDiv.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    selectedIndex = idx;
                    activeContextMenuTaskIndex = idx;
                    renderTasks();
                    
                    contextMenu.style.left = `${e.pageX}px`;
                    contextMenu.style.top = `${e.pageY}px`;
                    contextMenu.classList.remove('hidden');
                });

                taskListbox.appendChild(itemDiv);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 新增代辦
        function addTask() {
            const content = contentInput.value.trim();
            if (!content) {
                alert("請輸入代辦事項內容！");
                return;
            }

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            const dateStr = now.toISOString().split('T')[0];

            tasks.push({
                checked: false,
                content: content,
                reminder_type: "none",
                time: timeStr,
                date: dateStr,
                days_of_month: [],
                notified: false
            });

            contentInput.value = "";
            saveData();
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);
        contentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

        // 刪除代辦
        delBtn.addEventListener('click', () => {
            if (selectedIndex === null || selectedIndex >= tasks.length) {
                alert("請先點選想要刪除的事項！");
                return;
            }
            tasks.splice(selectedIndex, 1);
            selectedIndex = null;
            saveData();
            renderTasks();
        });

        // 關閉右鍵選單
        window.addEventListener('click', () => { contextMenu.classList.add('hidden'); });

        // 右鍵選單動作分發
        contextMenu.querySelectorAll('[data-action]').forEach(el => {
            el.addEventListener('click', (e) => {
                const action = e.target.getAttribute('data-action');
                if (activeContextMenuTaskIndex !== null) {
                    handleReminderConfig(activeContextMenuTaskIndex, action);
                }
            });
        });

        // 提醒設定彈窗邏輯
        function handleReminderConfig(idx, rType) {
            const task = tasks[idx];
            if (rType === 'none') {
                task.reminder_type = "none";
                task.notified = false;
                saveData();
                renderTasks();
                return;
            }

            modalTitle.textContent = "設定提醒項目";
            modalBody.innerHTML = "";
            let htmlContent = "";

            if (rType === 'once') {
                htmlContent = `
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">選擇日期 (YYYY-MM-DD)</label>
                        <input type="date" id="remind-date" value="${task.date || new Date().toISOString().split('T')[0]}" class="w-full border rounded px-2 py-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">提醒時間 (HH:MM 或 0900)</label>
                        <input type="text" id="remind-time" value="${task.time || '09:00'}" class="w-full border rounded px-2 py-1 text-sm">
                    </div>
                `;
            } else if (rType === 'weekday' || rType === 'weekend') {
                htmlContent = `
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">每日提醒時間 (HH:MM 或 0900)</label>
                        <input type="text" id="remind-time" value="${task.time || '09:00'}" class="w-full border rounded px-2 py-1 text-sm">
                    </div>
                `;
            } else if (rType === 'monthly') {
                const defaultDays = (task.days_of_month || [1, 15]).join(",");
                htmlContent = `
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">每月特定日期（逗號分隔，例如：1,15,25）</label>
                        <input type="text" id="remind-days" value="${defaultDays}" class="w-full border rounded px-2 py-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">提醒時間 (HH:MM 或 0900)</label>
                        <input type="text" id="remind-time" value="${task.time || '09:00'}" class="w-full border rounded px-2 py-1 text-sm">
                    </div>
                `;
            }

            modalBody.innerHTML = htmlContent;
            reminderModal.classList.remove('hidden');

            // 綁定確定按鈕事件
            const confirmHandler = () => {
                const timeRaw = document.getElementById('remind-time') ? document.getElementById('remind-time').value : "";
                const timeAns = formatTimeInput(timeRaw);
                
                if (timeRaw && !/^\d{2}:\d{2}$/.test(timeAns)) {
                    alert("時間格式不正確！請輸入正確的格式 (例如 09:00 或 0900)");
                    return;
                }

                task.reminder_type = rType;
                if (timeAns) task.time = timeAns;
                task.notified = false;

                if (rType === 'once') {
                    task.date = document.getElementById('remind-date').value;
                } else if (rType === 'monthly') {
                    const daysStr = document.getElementById('remind-days').value;
                    const daysList = daysStr.split(',').map(d => parseInt(d.trim())).filter(d => !isNaN(d));
                    task.days_of_month = daysList;
                }

                saveData();
                renderTasks();
                closeModal();
            };

            modalConfirm.onclick = confirmHandler;
        }

        function closeModal() {
            reminderModal.classList.add('hidden');
            modalConfirm.onclick = null;
        }

        modalCancel.onclick = closeModal;

        // 透明度與置頂控制
        alphaScale.addEventListener('input', (e) => {
            alphaVal = parseFloat(e.target.value);
            appContainer.style.opacity = alphaVal;
            simpleContainer.style.opacity = alphaVal;
            saveData();
        });

        topmostCheck.addEventListener('change', (e) => {
            topmostVal = e.target.checked;
            // 網頁版利用 z-index 模擬置頂效果
            if (topmostVal) {
                appContainer.style.zIndex = "999";
            } else {
                appContainer.style.zIndex = "1";
            }
            saveData();
        });

        // 簡易畫面切換
        simpleBtn.addEventListener('click', () => {
            const checkedTasks = tasks.filter(t => t.checked);
            if (checkedTasks.length === 0) {
                alert("請先在清單項目上雙擊打勾 [✓] 要顯示在簡易畫面的事項！");
                return;
            }

            const lines = checkedTasks.map(t => {
                let tagStr = "";
                const rType = t.reminder_type || "none";
                if (rType === "once") tagStr = ` (${t.date} ${t.time})`;
                else if (rType === "weekday") tagStr = ` (平日 ${t.time})`;
                else if (rType === "weekend") tagStr = ` (假日 ${t.time})`;
                else if (rType === "monthly") tagStr = ` (每月 ${(t.days_of_month||[]).join(",")}日 ${t.time})`;
                return `• ${t.content}${tagStr}`;
            });

            simpleTextContent.textContent = lines.join("\n");
            appContainer.classList.add('hidden');
            simpleContainer.classList.remove('hidden');

            // 預設置中簡易視窗
            simpleContainer.style.top = `${window.innerHeight / 2 - 50}px`;
            simpleContainer.style.left = `${window.innerWidth / 2 - 150}px`;
        });

        function switchToMain() {
            simpleContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
        }

        backMainBtn.addEventListener('click', switchToMain);
        simpleContainer.addEventListener('dblclick', (e) => {
            if (e.target === simpleContainer || e.target === simpleTextContent) {
                switchToMain();
            }
        });

        // 簡易視窗滑鼠拖曳移動功能
        let isDragging = false, startX, startY;
        simpleContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - simpleContainer.offsetLeft;
            startY = e.clientY - simpleContainer.offsetTop;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            simpleContainer.style.left = `${e.clientX - startX}px`;
            simpleContainer.style.top = `${e.clientY - startY}px`;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // 背景鬧鐘時間檢查機制 (每秒檢查一次)
        setInterval(() => {
            const now = new Date();
            const nowDateStr = now.toISOString().split('T')[0];
            const nowTimeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            const weekday = (now.getDay() + 6) % 6; // 轉換 0(一) ~ 6(日)
            const currentDay = now.getDate();

            tasks.forEach(t => {
                const rType = t.reminder_type || "none";
                if (rType === "none") return;

                let trigger = false;
                if (rType === "once" && !t.notified) {
                    if (t.date === nowDateStr && t.time === nowTimeStr) {
                        trigger = true;
                        t.notified = true;
                    }
                } else if (rType === "weekday" && now.getDay() >= 1 && now.getDay() <= 5) {
                    if (t.time === nowTimeStr) trigger = true;
                } else if (rType === "weekend" && (now.getDay() === 0 || now.getDay() === 6)) {
                    if (t.time === nowTimeStr) trigger = true;
                } else if (rType === "monthly") {
                    if ((t.days_of_month || []).includes(currentDay) && t.time === nowTimeStr) {
                        trigger = true;
                    }
                }

                if (trigger) {
                    saveData();
                    switchToMain();
                    appContainer.style.opacity = "1.0";
                    alphaScale.value = "1.0";
                    alert(`⏰ 時間到！\n\n提醒您：${t.content}`);
                }
            });
        }, 10000);

        // 初始化載入
        loadData();
    </script>
</body>
</html>
