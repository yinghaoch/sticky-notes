<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便箋</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: transparent; }
    </style>
</head>
<body class="overflow-hidden h-screen w-screen flex items-center justify-center m-0">

    <!-- 主便箋視窗 -->
    <div id="app-container" class="w-80 bg-[#FDF6C7] rounded-lg shadow-xl border border-[#E8D58B] flex flex-col p-3 relative" style="height: 440px;">
        
        <!-- 頂部輸入區 -->
        <div class="flex gap-2 mb-2">
            <input type="text" id="content-input" placeholder="輸入待辦事項..." class="flex-1 px-2 py-1 text-sm border border-[#E8D58B] rounded bg-white/80 focus:outline-none focus:ring-1 focus:ring-amber-500">
            <button id="add-btn" class="px-3 py-1 bg-[#E8D58B] hover:bg-[#d8c375] text-amber-900 text-sm font-medium rounded transition">新增代辦</button>
        </div>

        <!-- 事項清單區 -->
        <div id="task-listbox" class="flex-1 bg-white/50 border border-[#E8D58B]/50 rounded p-2 overflow-y-auto flex flex-col gap-1">
            <div class="text-center text-gray-400 text-xs mt-10">目前沒有待辦事項，請在上方新增！</div>
        </div>

        <!-- 底部控制列 -->
        <div class="flex items-center justify-between pt-2 mt-2 border-t border-[#E8D58B]/60 text-xs text-gray-700">
            <button id="del-btn" class="px-3 py-1 bg-amber-100 hover:bg-amber-200 rounded border border-amber-300 transition">刪除選定</button>
        </div>

        <!-- 懸浮置頂按鈕 (子母畫面) -->
        <button id="float-btn" class="w-full mt-2 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded shadow transition">
            📌 懸浮置頂 (子母畫面模式)
        </button>
    </div>

    <!-- 右鍵選單：設定提醒與狀態 -->
    <div id="custom-context-menu" class="hidden fixed bg-white border border-gray-300 shadow-md rounded py-1 z-50 text-xs w-36">
        <div class="px-3 py-1.5 font-bold text-amber-800 bg-amber-50">⚡ 狀態切換</div>
        <div class="px-3 py-1.5 hover:bg-green-50 text-green-600 cursor-pointer" data-status="completed">已完成</div>
        <div class="px-3 py-1.5 hover:bg-red-50 text-red-600 cursor-pointer" data-status="uncompleted">未完成</div>
        <div class="border-t border-gray-200 my-1"></div>
        <div class="px-3 py-1.5 font-bold text-amber-800 bg-amber-50">⏰ 設定提醒</div>
        <div class="border-t border-gray-200 my-1"></div>
        <div class="px-3 py-1.5 hover:bg-blue-50 cursor-pointer" data-action="once">單次提醒</div>
        <div class="px-3 py-1.5 hover:bg-blue-50 cursor-pointer" data-action="weekday">平日提醒 (週一至週五)</div>
        <div class="px-3 py-1.5 hover:bg-blue-50 cursor-pointer" data-action="weekend">假日提醒 (週六、週日)</div>
        <div class="px-3 py-1.5 hover:bg-blue-50 cursor-pointer" data-action="monthly">每月特定日期</div>
        <div class="border-t border-gray-200 my-1"></div>
        <div class="px-3 py-1.5 hover:bg-red-50 text-red-600 cursor-pointer" data-action="none">取消提醒</div>
    </div>

    <!-- 設定提醒的彈出視窗 -->
    <div id="reminder-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-4 w-72 shadow-xl border border-gray-200 flex flex-col gap-3">
            <h3 id="modal-title" class="text-sm font-bold text-gray-800">設定提醒項目</h3>
            <div id="modal-body" class="flex flex-col gap-2"></div>
            <div class="flex justify-end gap-2 mt-2">
                <button id="modal-cancel" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs rounded">取消</button>
                <button id="modal-confirm" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white text-xs rounded">確定</button>
            </div>
        </div>
    </div>

    <!-- 隱藏的子母畫面元素 -->
    <canvas id="canvas" class="hidden"></canvas>
    <video id="video-stream" class="hidden" autoplay muted playsinline></video>

    <script>
        let tasks = [];
        let selectedIndex = null;
        let activeContextMenuTaskIndex = null;

        const appContainer = document.getElementById('app-container');
        const contentInput = document.getElementById('content-input');
        const addBtn = document.getElementById('add-btn');
        const taskListbox = document.getElementById('task-listbox');
        const delBtn = document.getElementById('del-btn');
        const floatBtn = document.getElementById('float-btn');

        const contextMenu = document.getElementById('custom-context-menu');
        const reminderModal = document.getElementById('reminder-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalCancel = document.getElementById('modal-cancel');
        const modalConfirm = document.getElementById('modal-confirm');

        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video-stream');
        const ctx = canvas.getContext('2d');

        if ("Notification" in window) {
            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function loadData() {
            const saved = localStorage.getItem('sticky_notes_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    tasks = data.tasks || [];
                } catch (e) {
                    tasks = [];
                }
            }
            renderTasks();
        }

        function saveData() {
            const data = { tasks: tasks };
            localStorage.setItem('sticky_notes_data', JSON.stringify(data));
        }

        function formatTimeInput(rawStr) {
            let val = rawStr.trim();
            if (!val.includes(":") && val.length === 4 && /^\d{4}$/.test(val)) {
                val = val.substring(0, 2) + ":" + val.substring(2);
            }
            return val;
        }

        function getTaskStatusText(t) {
            return t.checked ? "[已完成]" : "[未完成]";
        }

        function getTaskStatusColorClass(t) {
            return t.checked ? "text-green-600 font-bold" : "text-red-600 font-bold";
        }

        function getReminderString(t) {
            const rType = t.reminder_type || "none";
            if (rType === "once") return `(單次 ${t.date} ${t.time})`;
            if (rType === "weekday") return `(平日 ${t.time})`;
            if (rType === "weekend") return `(假日 ${t.time})`;
            if (rType === "monthly") {
                const daysStr = (t.days_of_month || []).join(",");
                return `(每月 ${daysStr}日 ${t.time})`;
            }
            return "";
        }

        function renderTasks() {
            taskListbox.innerHTML = "";
            if (tasks.length === 0) {
                taskListbox.innerHTML = `<div class="text-center text-gray-400 text-xs mt-10">目前沒有待辦事項，請在上方新增！</div>`;
                return;
            }

            tasks.forEach((t, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between p-2 rounded cursor-pointer transition select-none text-sm ${selectedIndex === idx ? 'bg-[#E8D58B]/50 border border-[#E8D58B]' : 'hover:bg-amber-100/50 bg-white/60'}`;
                
                const statusText = getTaskStatusText(t);
                const statusColorClass = getTaskStatusColorClass(t);
                const reminderStr = getReminderString(t);

                itemDiv.innerHTML = `
                    <div class="flex items-center gap-1.5 overflow-hidden flex-1 flex-wrap">
                        <span class="font-mono font-bold">${t.checked ? '[✓]' : '[   ]'}</span>
                        <span class="${statusColorClass} text-xs">${statusText}</span>
                        <span class="text-gray-800">${escapeHtml(t.content)}</span>
                        <span class="text-xs text-amber-700">${reminderStr}</span>
                    </div>
                `;

                itemDiv.addEventListener('click', () => { selectedIndex = idx; renderTasks(); });
                itemDiv.addEventListener('dblclick', () => { t.checked = !t.checked; saveData(); renderTasks(); });
                itemDiv.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    selectedIndex = idx;
                    activeContextMenuTaskIndex = idx;
                    renderTasks();
                    contextMenu.style.left = `${e.pageX}px`;
                    contextMenu.style.top = `${e.pageY}px`;
                    contextMenu.classList.remove('hidden');
                });

                taskListbox.appendChild(itemDiv);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function addTask() {
            const content = contentInput.value.trim();
            if (!content) { alert("請輸入代辦事項內容！"); return; }

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            const dateStr = now.toISOString().split('T')[0];

            tasks.push({ checked: false, content: content, reminder_type: "none", time: timeStr, date: dateStr, days_of_month: [], notified: false });
            contentInput.value = "";
            saveData();
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);
        contentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

        delBtn.addEventListener('click', () => {
            if (selectedIndex === null || selectedIndex >= tasks.length) { alert("請先點選想要刪除的事項！"); return; }
            tasks.splice(selectedIndex, 1);
            selectedIndex = null;
            saveData();
            renderTasks();
        });

        window.addEventListener('click', () => { contextMenu.classList.add('hidden'); });

        contextMenu.querySelectorAll('[data-status]').forEach(el => {
            el.addEventListener('click', (e) => {
                const status = e.target.getAttribute('data-status');
                if (activeContextMenuTaskIndex !== null) {
                    tasks[activeContextMenuTaskIndex].checked = (status === 'completed');
                    saveData();
                    renderTasks();
                }
            });
        });

        contextMenu.querySelectorAll('[data-action]').forEach(el => {
            el.addEventListener('click', (e) => {
                const action = e.target.getAttribute('data-action');
                if (activeContextMenuTaskIndex !== null) { handleReminderConfig(activeContextMenuTaskIndex, action); }
            });
        });

        function handleReminderConfig(idx, rType) {
            const task = tasks[idx];
            if (rType === 'none') {
                task.reminder_type = "none";
                task.notified = false;
                saveData();
                renderTasks();
                return;
            }

            modalTitle.textContent = "設定提醒項目";
            modalBody.innerHTML = "";
            let htmlContent = "";

            if (rType === 'once') {
                htmlContent = `
                    <div><label class="block text-xs text-gray-600 mb-1">選擇日期 (YYYY-MM-DD)</label><input type="date" id="remind-date" value="${task.date || new Date().toISOString().split('T')[0]}" class="w-full border rounded px-2 py-1 text-sm"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">提醒時間 (HH:MM 或 0900)</label><input type="text" id="remind-time" value="${task.time || '09:00'}" class="w-full border rounded px-2 py-1 text-sm"></div>
                `;
            } else if (rType === 'weekday' || rType === 'weekend') {
                htmlContent = `<div><label class="block text-xs text-gray-600 mb-1">每日提醒時間 (HH:MM 或 0900)</label><input type="text" id="remind-time" value="${task.time || '09:00'}" class="w-full border rounded px-2 py-1 text-sm"></div>`;
            } else if (rType === 'monthly') {
                const defaultDays = (task.days_of_month || [1, 15]).join(",");
                htmlContent = `
                    <div><label class="block text-xs text-gray-600 mb-1">每月特定日期（逗號分隔，例如：1,15,25）</label><input type="text" id="remind-days" value="${defaultDays}" class="w-full border rounded px-2 py-1 text-sm"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">提醒時間 (HH:MM 或 0900)</label><input type="text" id="remind-time" value="${task.time || '09:00'}" class="w-full border rounded px-2 py-1 text-sm"></div>
                `;
            }

            modalBody.innerHTML = htmlContent;
            reminderModal.classList.remove('hidden');

            modalConfirm.onclick = () => {
                const timeRaw = document.getElementById('remind-time') ? document.getElementById('remind-time'].value : "";
                const timeAns = formatTimeInput(timeRaw);
                
                if (timeRaw && !/^\d{2}:\d{2}$/.test(timeAns)) {
                    alert("時間格式不正確！請輸入正確的格式 (例如 09:00 或 0900)");
                    return;
                }

                task.reminder_type = rType;
                if (timeAns) task.time = timeAns;
                task.notified = false;

                if (rType === 'once') {
                    task.date = document.getElementById('remind-date').value;
                } else if (rType === 'monthly') {
                    const daysStr = document.getElementById('remind-days').value;
                    task.days_of_month = daysStr.split(',').map(d => parseInt(d.trim())).filter(d => !isNaN(d));
                }

                saveData();
                renderTasks();
                closeModal();
            };
        }

        function closeModal() { reminderModal.classList.add('hidden'); modalConfirm.onclick = null; }
        modalCancel.onclick = closeModal;

        // 懸浮置頂 (子母畫面 PiP 模式)，依據內容動態計算最適高度與寬度
        floatBtn.addEventListener('click', async () => {
            // 動態計算子母畫面的寬高
            const padding = 15;
            const titleHeight = 35;
            const itemHeight = 28;
            
            // 計算最大文字寬度以決定畫布寬度
            const tempCtx = canvas.getContext('2d');
            tempCtx.font = "12px sans-serif";
            
            let maxTextWidth = 200; // 預設最小寬度
            tasks.forEach(t => {
                const checkStr = t.checked ? '[✓] ' : '[   ] ';
                const statusText = t.checked ? '[已完成]' : '[未完成]';
                const reminderStr = getReminderString(t);
                const fullStr = checkStr + statusText + " " + t.content + (reminderStr ? " " + reminderStr : "");
                const metrics = tempCtx.measureText(fullStr);
                if (metrics.width > maxTextWidth) {
                    maxTextWidth = metrics.width;
                }
            });

            canvas.width = Math.ceil(maxTextWidth + (padding * 2));
            canvas.height = Math.max(80, titleHeight + (tasks.length * itemHeight) + (padding * 2));

            function drawLoop() {
                ctx.fillStyle = "#FDF6C7";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#451a03";
                ctx.font = "bold 14px sans-serif";
                ctx.fillText("📌 待辦事項便箋", padding, 25);
                
                ctx.font = "12px sans-serif";
                tasks.forEach((t, i) => {
                    const checkStr = t.checked ? '[✓] ' : '[   ] ';
                    const statusText = t.checked ? '[已完成]' : '[未完成]';
                    const reminderStr = getReminderString(t);
                    const y = 55 + (i * itemHeight);

                    let currentX = padding;

                    // 繪製勾選方塊
                    ctx.fillStyle = "#451a03";
                    ctx.fillText(checkStr, currentX, y);
                    currentX += ctx.measureText(checkStr).width;

                    // 繪製狀態 ([已完成] 綠色 / [未完成] 紅色)
                    ctx.fillStyle = t.checked ? "#16a34a" : "#dc2626";
                    ctx.fillText(statusText, currentX, y);
                    currentX += ctx.measureText(statusText + " ").width;

                    // 繪製內文與提醒日期時間
                    ctx.fillStyle = "#1f2937";
                    ctx.fillText(t.content + (reminderStr ? " " + reminderStr : ""), currentX, y);
                });
                requestAnimationFrame(drawLoop);
            }
            drawLoop();

            const stream = canvas.captureStream();
            video.srcObject = stream;
            await video.play();
            if (video !== document.pictureInPictureElement) {
                await video.requestPictureInPicture();
            }
        });

        // 背景鬧鐘時間檢查與通知發送
        setInterval(() => {
            const now = new Date();
            const nowDateStr = now.toISOString().split('T')[0];
            const nowTimeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            const currentDay = now.getDate();

            tasks.forEach(t => {
                const rType = t.reminder_type || "none";
                if (rType === "none") return;

                let trigger = false;
                if (rType === "once" && !t.notified) {
                    if (t.date === nowDateStr && t.time === nowTimeStr) { trigger = true; t.notified = true; }
                } else if (rType === "weekday" && now.getDay() >= 1 && now.getDay() <= 5) {
                    if (t.time === nowTimeStr) trigger = true;
                } else if (rType === "weekend" && (now.getDay() === 0 || now.getDay() === 6)) {
                    if (t.time === nowTimeStr) trigger = true;
                } else if (rType === "monthly") {
                    if ((t.days_of_month || []).includes(currentDay) && t.time === nowTimeStr) { trigger = true; }
                }

                if (trigger) {
                    saveData();
                    if ("Notification" in window) {
                        if (Notification.permission === "granted") {
                            new Notification("⏰ 時間到！提醒您：", {
                                body: t.content,
                                icon: "https://cdn-icons-png.flaticon.com/512/3239/3239952.png",
                                silent: true
                            });
                        } else if (Notification.permission !== "denied") {
                            Notification.requestPermission().then(permission => {
                                if (permission === "granted") {
                                    new Notification("⏰ 時間到！提醒您：", {
                                        body: t.content,
                                        icon: "https://cdn-icons-png.flaticon.com/512/3239/3239952.png",
                                        silent: true
                                    });
                                }
                            });
                        }
                    }
                }
            });
        }, 10000);

        loadData();
    </script>
</body>
</html>
