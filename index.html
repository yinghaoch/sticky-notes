<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便箋</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        #app-container { transition: opacity 0.2s; }
    </style>
</head>
<body class="p-4">

    <!-- 實際渲染的區域 -->
    <div id="render-area" class="w-80 bg-[#FDF6C7] rounded-lg shadow-xl border border-[#E8D58B] p-4">
        <div class="flex gap-2 mb-2">
            <input type="text" id="content-input" placeholder="輸入待辦事項..." class="flex-1 px-2 py-1 text-sm border border-[#E8D58B] rounded bg-white/80 focus:outline-none">
            <button id="add-btn" class="px-3 py-1 bg-[#E8D58B] text-amber-900 text-sm font-medium rounded">新增</button>
        </div>

        <div id="task-listbox" class="h-64 bg-white/50 border border-[#E8D58B]/50 rounded p-2 overflow-y-auto text-sm">
            <!-- 事項列表 -->
        </div>

        <button id="float-btn" class="w-full mt-3 py-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded shadow-lg">
            📌 強制置頂 (子母畫面模式)
        </button>
    </div>

    <!-- 用於生成置頂畫面的隱藏元素 -->
    <video id="video-stream" class="hidden" muted autoplay playsinline></video>
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        let tasks = [];
        const contentInput = document.getElementById('content-input');
        const addBtn = document.getElementById('add-btn');
        const taskListbox = document.getElementById('task-listbox');
        const floatBtn = document.getElementById('float-btn');
        const video = document.getElementById('video-stream');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const renderArea = document.getElementById('render-area');

        // 渲染列表內容
        function renderTasks() {
            taskListbox.innerHTML = tasks.length === 0 ? '<div class="text-gray-400 text-center mt-10">無事項</div>' : '';
            tasks.forEach((t, idx) => {
                const div = document.createElement('div');
                div.className = "p-1 border-b border-amber-200/50";
                div.textContent = (t.checked ? '[✓] ' : '[ ] ') + t.text;
                div.onclick = () => { t.checked = !t.checked; renderTasks(); };
                taskListbox.appendChild(div);
            });
        }

        addBtn.onclick = () => {
            if (contentInput.value) {
                tasks.push({ text: contentInput.value, checked: false });
                contentInput.value = '';
                renderTasks();
            }
        };

        // 強制置頂邏輯：將 DOM 轉為影片串流
        floatBtn.onclick = async () => {
            canvas.width = renderArea.offsetWidth;
            canvas.height = renderArea.offsetHeight;

            // 簡單將 HTML 轉繪到 Canvas
            function updateCanvas() {
                ctx.fillStyle = "#FDF6C7";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#451a03";
                ctx.font = "14px Arial";
                tasks.forEach((t, i) => {
                    ctx.fillText((t.checked ? '✓ ' : '☐ ') + t.text, 10, 30 + (i * 20));
                });
                requestAnimationFrame(updateCanvas);
            }
            updateCanvas();

            const stream = canvas.captureStream();
            video.srcObject = stream;
            await video.play();
            
            if (video !== document.pictureInPictureElement) {
                await video.requestPictureInPicture();
            }
        };
    </script>
</body>
</html>
